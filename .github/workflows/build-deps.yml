# Builds Skia for every platform from source, packages it as the archives a
# `.binaryTarget` takes, and builds and tests NucleantSkia against them — one
# machine per platform (Linux: per architecture), a step per architecture:
#
#   apple    Skia.xcframework.zip                       macOS + iOS + simulator
#   linux    skia-linux-x86_64.artifactbundle.zip       \
#            skia-linux-aarch64.artifactbundle.zip       |
#   windows  skia-windows-x86_64.artifactbundle.zip      |  static-library
#   android  skia-android-arm64-v8a.artifactbundle.zip   |  artifact bundles
#            skia-android-x86_64.artifactbundle.zip      |  (SE-0482)
#   wasm     skia-wasm32.artifactbundle.zip             /
#
# The archives are this run's artifacts ("skia-*"). Run it by hand to check
# that the dependencies still build; release.yml runs it for each release and
# attaches the archives to the release.
#
# The tests take the archive through Package.swift's Artifacts/ directory, so
# they build exactly what a release ships.

name: build-deps

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build (all, or one to retry)
        type: choice
        options: [all, apple, linux, windows, android, wasm]
        default: all
  workflow_call:
    inputs:
      version:
        description: Version written into the artifact bundles' info.json
        type: string
        default: 0.0.0

env:
  SWIFT_VERSION: 6.3.3
  VERSION: ${{ inputs.version || '0.0.0' }}
  # NucleantVulkan from GitHub; there is no sibling checkout here anyway.
  NUCLEANT_LOCAL_DEV: "0"
  # Package.swift takes Skia from Artifacts/, where the tests put the archive.
  NUCLEANT_SKIA_ARTIFACTS: "1"

jobs:
  apple:
    if: inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'apple'
    # One arm64 Mac builds every configuration, a step each: macOS arm64 +
    # x86_64, iOS, and the simulator's arm64 + x86_64.
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      # build_skia_apple.py refuses Xcode's bundled python3.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: brew install ninja
      # One step per configuration, out of one Skia checkout (synced by the first).
      - name: Build macOS arm64
        run: python scripts/build_skia_apple.py build --out apple --config macos-arm64
      - name: Build macOS x86_64
        run: python scripts/build_skia_apple.py build --out apple --config macos-x64 --skip-sync
      - name: Build iOS arm64
        run: python scripts/build_skia_apple.py build --out apple --config ios-arm64 --skip-sync
      - name: Build iOS simulator arm64
        run: python scripts/build_skia_apple.py build --out apple --config ios-sim-arm64 --skip-sync
      - name: Build iOS simulator x86_64
        run: python scripts/build_skia_apple.py build --out apple --config ios-sim-x64 --skip-sync
      - name: Package
        run: python scripts/build_skia_apple.py package --inputs apple/* --output dist
      - uses: actions/upload-artifact@v7
        with:
          name: skia-apple
          path: dist/Skia.xcframework.zip
      - name: Install Swift ${{ env.SWIFT_VERSION }}
        run: |
          release="swift-${SWIFT_VERSION}-RELEASE"
          curl -fsSLO "https://download.swift.org/swift-${SWIFT_VERSION}-release/xcode/${release}/${release}-osx.pkg"
          installer -pkg "${release}-osx.pkg" -target CurrentUserHomeDirectory
          echo "$HOME/Library/Developer/Toolchains/${release}.xctoolchain/usr/bin" >> "$GITHUB_PATH"
      - name: Test against it
        run: |
          mkdir -p Artifacts && cp dist/Skia.xcframework.zip Artifacts/
          swift test

  linux:
    name: linux (${{ matrix.arch }})
    if: inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'linux'
    # A machine per architecture: a Linux machine builds and tests its own.
    # In Swift's own image, which has the toolchain; Ubuntu 24.04's GCC builds
    # Skia, as Dependencies/linux is.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    container: swift:6.3.3-noble
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      # Skia's build, against the machine's fontconfig (expat and zlib are
      # Skia's own).
      - name: System packages
        run: >
          apt-get update && apt-get install -y
          g++ git python3 ninja-build patch curl libfontconfig1-dev
      - name: skia-python
        run: |
          # build_skia.py builds out of skia-python, next to this checkout.
          git config --global --add safe.directory '*'
          # At the commit build_skia.py builds from (SKIA_PYTHON_REF): its
          # skia submodule is the Skia every platform builds.
          ref=$(sed -n 's/^SKIA_PYTHON_REF = "\(.*\)"$/\1/p' scripts/build_skia.py)
          git init -q ../skia-python
          git -C ../skia-python fetch -q --depth 1 https://github.com/NucleantUI/skia-python.git "$ref"
          git -C ../skia-python checkout -q FETCH_HEAD
          git -C ../skia-python submodule update --init --depth 1 depot_tools skia
          # As skia-python's own Linux build: the system's ninja and Skia's
          # own gn (bin/fetch-gn, run by git-sync-deps), not depot_tools' wrappers.
          mv ../skia-python/depot_tools/ninja ../skia-python/depot_tools/ninja.bak
          mv ../skia-python/depot_tools/gn ../skia-python/depot_tools/gn.bak
          echo "$(cd ../skia-python/skia && pwd)/bin" >> "$GITHUB_PATH"
      - name: Build Skia ${{ matrix.arch }}
        run: |
          # Only this machine's build goes into the bundle, not the committed archives.
          rm -rf Dependencies/linux/lib Dependencies/linux/include
          python3 scripts/build_skia.py
      - name: Package ${{ matrix.arch }}
        run: >
          python3 scripts/make_artifactbundle.py
          --lib-dir Dependencies/linux/lib --include Dependencies/linux/include
          --triple ${{ matrix.arch }}-unknown-linux-gnu
          --name skia-linux-${{ matrix.arch }} --output dist --version "$VERSION" --ar ar
      - uses: actions/upload-artifact@v7
        with:
          name: skia-linux-${{ matrix.arch }}
          path: dist/skia-linux-${{ matrix.arch }}.artifactbundle.zip

  linux-test:
    name: linux test (${{ matrix.arch }})
    needs: linux
    # A fresh Swift image with only libfontconfig1-dev, the one system
    # library Skia links: the bundle and NucleantVulkan's release (with its
    # own libraries) have to build and run the tests, as on a user's machine.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    container: swift:6.3.3-noble
    steps:
      - uses: actions/checkout@v7
      - run: apt-get update && apt-get install -y libfontconfig1-dev
      - uses: actions/download-artifact@v8
        with:
          name: skia-linux-${{ matrix.arch }}
          path: Artifacts
      - name: Test against it, ${{ matrix.arch }}
        run: swift test

  windows:
    name: windows (x86_64)
    # Native, with MSVC: Skia's GN finds Visual Studio itself. x86_64 only,
    # for now. Bash, for the patches build_skia.py applies to Skia.
    if: inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-2025
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      # Python 3.13 through uv, as python and python3 (Skia's GN runs
      # python3), and ninja.
      - uses: astral-sh/setup-uv@v8
      - name: Python 3.13 and ninja
        run: |
          uv python install 3.13 --default --preview-features python-install-default
          uv tool install ninja
          uv python dir --bin >> "$GITHUB_PATH"
          uv tool dir --bin >> "$GITHUB_PATH"
      - name: skia-python
        run: |
          # Skia's sources as they are, for its patches (no CRLF), and its
          # deepest paths.
          git config --global core.autocrlf false
          git config --global core.longpaths true
          # At the commit build_skia.py builds from (SKIA_PYTHON_REF): its
          # skia submodule is the Skia every platform builds.
          ref=$(sed -n 's/^SKIA_PYTHON_REF = "\(.*\)"$/\1/p' scripts/build_skia.py)
          git init -q ../skia-python
          git -C ../skia-python fetch -q --depth 1 https://github.com/NucleantUI/skia-python.git "$ref"
          git -C ../skia-python checkout -q FETCH_HEAD
          git -C ../skia-python submodule update --init --depth 1 depot_tools skia
      - name: Build Skia x86_64
        run: python scripts/build_skia.py
      - name: Package x86_64
        run: >
          python scripts/make_artifactbundle.py
          --lib-dir Dependencies/windows/lib --include Dependencies/windows/include
          --triple x86_64-unknown-windows-msvc
          --name skia-windows-x86_64 --output dist --version "$VERSION"
          --ar "C:/Program Files/LLVM/bin/llvm-lib.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: skia-windows-x86_64
          path: dist/skia-windows-x86_64.artifactbundle.zip

  windows-test:
    name: windows test (x86_64)
    needs: windows
    # A fresh machine with nothing but Swift: the bundle and NucleantVulkan's
    # release have to build and run the tests. It has no GPU, so Mesa's
    # software Vulkan driver (lavapipe) is the one the loader finds — for
    # Skia drawing on the engine's device
    # (Tests/NucleantSkiaTests/SkiaWin32Tests.swift).
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: skia-windows-x86_64
          path: Artifacts
      - uses: compnerd/gha-setup-swift@v0.5.1
        with:
          swift-version: swift-${{ env.SWIFT_VERSION }}-release
          swift-build: ${{ env.SWIFT_VERSION }}-RELEASE
      - name: lavapipe
        run: |
          $version = "26.2.4"
          curl.exe -fsSL -o mesa.7z "https://github.com/pal1000/mesa-dist-win/releases/download/$version/mesa3d-$version-release-msvc.7z"
          7z x mesa.7z -omesa x64/vulkan_lvp.dll x64/lvp_icd.x86_64.json -r | Out-Null
          $icd = (Resolve-Path mesa/x64/lvp_icd.x86_64.json).Path
          Get-Content $icd
          # Registered the way an installed driver is: the loader ignores
          # VK_DRIVER_FILES in an elevated process, which the runner's are.
          $drivers = "HKLM:\SOFTWARE\Khronos\Vulkan\Drivers"
          New-Item -Path $drivers -Force | Out-Null
          New-ItemProperty -Path $drivers -Name $icd -PropertyType DWord -Value 0 -Force | Out-Null
      - name: Test against it, x86_64
        run: swift test

  android:
    if: inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'android'
    # Both ABIs on one machine, a step each, in Swift's image for the
    # cross-compile after.
    runs-on: ubuntu-24.04
    container: swift:6.3.3-noble
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      # g++: Skia's GN asks the host compiler (cc) for its version.
      - run: apt-get update && apt-get install -y g++ python3 ninja-build patch curl unzip
      # NDK r28, the line Dependencies/android is built with.
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c
          add-to-path: false
      - run: echo "ANDROID_NDK_HOME=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
      - name: skia-python
        run: |
          git config --global --add safe.directory '*'
          # At the commit build_skia.py builds from (SKIA_PYTHON_REF): its
          # skia submodule is the Skia every platform builds.
          ref=$(sed -n 's/^SKIA_PYTHON_REF = "\(.*\)"$/\1/p' scripts/build_skia.py)
          git init -q ../skia-python
          git -C ../skia-python fetch -q --depth 1 https://github.com/NucleantUI/skia-python.git "$ref"
          git -C ../skia-python checkout -q FETCH_HEAD
          git -C ../skia-python submodule update --init --depth 1 depot_tools skia
          mv ../skia-python/depot_tools/ninja ../skia-python/depot_tools/ninja.bak
          mv ../skia-python/depot_tools/gn ../skia-python/depot_tools/gn.bak
          echo "$(cd ../skia-python/skia && pwd)/bin" >> "$GITHUB_PATH"
      - run: rm -rf Dependencies/android
      - name: Build arm64-v8a
        run: python3 scripts/build_skia.py --android --abis arm64-v8a
      - name: Build x86_64
        run: python3 scripts/build_skia.py --android --abis x86_64
      - name: Package arm64-v8a
        run: >
          python3 scripts/make_artifactbundle.py
          --lib-dir Dependencies/android/arm64-v8a/lib --include Dependencies/android/include
          --triple aarch64-unknown-linux-android28
          --name skia-android-arm64-v8a --output dist --version "$VERSION"
          --ar "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
      - name: Package x86_64
        run: >
          python3 scripts/make_artifactbundle.py
          --lib-dir Dependencies/android/x86_64/lib --include Dependencies/android/include
          --triple x86_64-unknown-linux-android28
          --name skia-android-x86_64 --output dist --version "$VERSION"
          --ar "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
      - uses: actions/upload-artifact@v7
        with:
          name: skia-android
          path: dist/skia-android-*.artifactbundle.zip
      - name: Swift's Android SDK
        run: |
          release="swift-${SWIFT_VERSION}-RELEASE"
          swift sdk install \
            "https://download.swift.org/swift-${SWIFT_VERSION}-release/android-sdk/${release}/${release}_android.artifactbundle.tar.gz" \
            --checksum d160cc3206dd1886dae3fef2337af5e25ec034692cd0ec225721c56cc69da7f5
          # Links the NDK's sysroot into the SDK.
          # Wherever SwiftPM put the bundle (not necessarily under $HOME in a container).
          setup=$(find / -path /proc -prune -o -path "*${release}_android.artifactbundle*" -name setup-android-sdk.sh -print 2>/dev/null | head -1)
          echo "setup script: $setup"
          if [ -z "$setup" ]; then
            find / -path /proc -prune -o -type d -name "${release}_android.artifactbundle" -print 2>/dev/null | head -1 | xargs -I{} find {} -maxdepth 3
            exit 1
          fi
          "$setup"
      # Cross-compiled: builds and links the tests, which no device runs here.
      - run: mkdir -p Artifacts && cp dist/skia-android-*.artifactbundle.zip Artifacts/
      - name: Build against it, arm64-v8a
        env:
          ANDROID_BUILD: "1"
          SWIFT_ANDROID_ABI: arm64-v8a
        run: swift build --swift-sdk aarch64-unknown-linux-android28 --build-tests
      - name: Build against it, x86_64
        env:
          ANDROID_BUILD: "1"
          SWIFT_ANDROID_ABI: x86_64
        run: swift build --swift-sdk x86_64-unknown-linux-android28 --build-tests

  wasm:
    if: inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'wasm'
    # build_skia_wasm.py runs Skia's build with the clang of the swift.org
    # toolchain matching the wasm SDK, from ~/Library/Developer/Toolchains.
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Swift ${{ env.SWIFT_VERSION }} and its wasm SDK
        run: |
          release="swift-${SWIFT_VERSION}-RELEASE"
          curl -fsSLO "https://download.swift.org/swift-${SWIFT_VERSION}-release/xcode/${release}/${release}-osx.pkg"
          installer -pkg "${release}-osx.pkg" -target CurrentUserHomeDirectory
          bin="$HOME/Library/Developer/Toolchains/${release}.xctoolchain/usr/bin"
          "$bin/swift" sdk install \
            "https://download.swift.org/swift-${SWIFT_VERSION}-release/wasm-sdk/${release}/${release}_wasm.artifactbundle.tar.gz" \
            --checksum cabfa08b73bb8ac783927ecd15fa386e99d0c139c5f232445067bcf58379cae7
          echo "TOOLCHAIN_BIN=$bin" >> "$GITHUB_ENV"
      - run: brew install ninja
      - name: Build Skia
        run: python scripts/build_skia_wasm.py
      - name: Package
        run: >
          python scripts/make_artifactbundle.py
          --lib-dir Dependencies/wasm/lib --include Dependencies/wasm/include --header-path dawn-headers
          --triple wasm32-unknown-wasip1
          --name skia-wasm32 --output dist --version "$VERSION" --ar "$TOOLCHAIN_BIN/llvm-ar"
      - uses: actions/upload-artifact@v7
        with:
          name: skia-wasm32
          path: dist/skia-wasm32.artifactbundle.zip
      # In headless Chrome on the page's WebGPU.
      - name: Test against it
        run: |
          mkdir -p Artifacts && cp dist/skia-wasm32.artifactbundle.zip Artifacts/
          python scripts/run_wasm_tests.py
